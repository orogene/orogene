[package]
name = "orogene"
version = "0.3.34"
description = "`node_modules/` package manager and utility toolkit."
readme = "README.md"
build = "build.rs"
license = "Apache-2.0"

authors.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[package.metadata.release]
tag = true

[package.metadata.wix]
upgrade-guid = "C5FC7FE8-A6AB-4897-8B26-01220D1C3FAD"
path-guid = "D7A7057F-9CE2-4FB0-A0CF-1293469361C5"

[dependencies]
# Workspace Deps
nassun = { version = "=0.3.34", path = "./crates/nassun" }
node-maintainer = { version = "=0.3.34", path = "./crates/node-maintainer" }
oro-client = { version = "=0.3.34", path = "./crates/oro-client" }
oro-common = { version = "=0.3.34", path = "./crates/oro-common" }
oro-config = { version = "=0.3.34", path = "./crates/oro-config" }
oro-npm-account = { version = "=0.3.34", path = "./crates/oro-npm-account" }
oro-package-spec = { version = "=0.3.34", path = "./crates/oro-package-spec" }
oro-pretty-json = { version = "=0.3.34", path = "./crates/oro-pretty-json" }

# Regular deps
async-std = { workspace = true, features = [
    "attributes",
    "tokio1",
    "unstable",
] }
async-trait = { workspace = true }
chrono = { workspace = true }
chrono-humanize = { workspace = true }
clap = { workspace = true, features = ["derive"] }
colored = { workspace = true }
dialoguer = { workspace = true, default-features = false }
directories = { workspace = true }
humansize = { workspace = true }
indicatif = { workspace = true }
is_ci = { workspace = true }
is-terminal = { workspace = true }
kdl = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
mimalloc = { workspace = true, optional = true }
rand = { workspace = true, features = ["thread_rng"], default_features = false }
sentry = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
supports-unicode = { workspace = true }
term_grid = { workspace = true }
term_size = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-indicatif = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }

[workspace]
members = [".", "crates/*"]

[workspace.package]
authors = ["Orogene Maintainers and Contributors"]
edition = "2024"
repository = "https://github.com/orogene/orogene"
homepage = "https://orogene.dev"
rust-version = "1.85"

[features]
default = ["error-reporting"]
mimalloc = ["dep:mimalloc"]
error-reporting = ["sentry"]
experimental-simdjson = ["nassun/experimental-simdjson"]

[workspace.dependencies]
anyhow = "1.0.96"
async-compression = "0.4.12"
async-process = "2.3.0"
async-std = "1.13.0"
async-trait = "0.1.86"
backon = "1.4.0"
base64 = "0.22.1"
bincode = "1.3.3"
bytecount = "0.6.8"
cacache = { version = "13.1.0", default-features = false, features = ["mmap", "tokio-runtime"] }
chrono = "0.4.40"
chrono-humanize = "0.2.3"
clap = "4.5.31"
colored = "3.0.0"
config = { version = "0.15.8", default-features = false }
console_error_panic_hook = "0.1.7"
darling = "0.20.10"
dashmap = "6.1.0"
derive_builder = "0.20.2"
dialoguer = { version = "0.10.4", default-features = false }
directories = "6.0.0"
dunce = "1.0.5"
flate2 = { version = "1.1.0", default-features = false }
futures = "0.3.31"
http = "1.2.0"
indexmap = "2.7.1"
indicatif = "0.17.11"
io_tee = "0.1.1"
is-terminal = "0.4.15"
is_ci = "1.2.0"
http-cache-reqwest = "0.15.1"
humansize = "1.1.0"
insta = "1.42.2"
js-sys = "0.3.77"
junction = "1.2.0"
kdl = "6.3.4"
maplit = "1.0.2"
miette = "7.5.0"
mimalloc = "0.1.43"
mockito = "1.6.1"
node-semver = "2.2.0"
nom = "8.0.0"
once_cell = "1.20.3"
open = "5.3.2"
pathdiff = "0.2.3"
percent-encoding = "2.3.1"
petgraph = { version = "0.7.1", default-features = false }
poloto = "19.1.2"
pretty_assertions = "1.4.1"
proc-macro2 = "1.0.93"
quote = "1.0.38"
rand = { version = "0.9.0", features = ["thread_rng"] , default-features = false }
reflink-copy = "0.1.24"
regex = "1.11.1"
reqwest = "0.12.12"
reqwest-middleware = "0.4.1"
resvg = "0.32.0"
rkyv = "0.8.10"
sentry = "0.36.0"
serde = "1.0.218"
serde_json = "1.0.139"
serde-wasm-bindgen = "0.6.5"
simd-json = "0.14.3"
ssri = "9.2.0"
supports-unicode = "3.0.0"
syn = "2.0.98"
tar = "0.4.44"
task-local-extensions = "0.1.4"
tempfile = "3.17.1"
term_grid = "0.2.0"
term_size = "0.3.2"
test-case = "3.3.1"
thiserror = "1.0.69"
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-indicatif = "0.3.9"
tracing-subscriber = "0.3.19"
tsify = { version = "0.4.5", default-features = false }
unicase = "2.8.1"
url = "2.5.4"
walkdir = "2.5.0"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
wasm-streams = "0.4.2"
which = "7.0.2"
wiremock = "0.6.3"
reqwest-retry = "0.7.0"

# [patch.crates-io]
# cacache = { path = "../cacache-rs" }
# reflink-copy = { path = "../reflink-copy" }

# Config for 'cargo dist'
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.3.1"
# The preferred Rust toolchain to use in CI (rustup toolchain syntax)
rust-toolchain-version = "1.85.0"
# CI backends to support
ci = ["github"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "msi"]
# The archive format to use for windows builds (defaults .zip)
windows-archive = ".tar.gz"
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# Publish jobs to run in CI
pr-run-mode = "plan"
# Skip checking whether the specified configuration files are up to date
allow-dirty = ["msi"]

[build-dependencies]
embed-resource = "3.0.1"

[[bin]]
name = "oro"
path = "src/main.rs"

[profile.release]
lto = "fat"
opt-level = 3
# strip = true
# debug = false
strip = false
debug = true

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"

[dev-dependencies]
backon = { workspace = true }
insta = { workspace = true, features = ["yaml"] }
poloto = { workspace = true }
resvg = { workspace = true }
tempfile = { workspace = true }

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3
